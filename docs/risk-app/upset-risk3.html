<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risiko-Kombinationen</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f7f7f7;
      color: #222;
    }
    h1 {
      margin: 0 0 0.5rem 0;
    }
    .controls {
      margin: 1rem 0;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    #plot {
      width: 100%;
      max-width: 1100px;
      height: 800px;
      background: white;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Risiko-Kombinationen</h1>
  <p>Mittelwert oder Median mit 95%-Konfidenzintervall und UpSet-Matrix der Kombinationen.</p>

  <div class="controls">
    <label>
      Kennwert:
      <select id="statSel">
        <option value="mean">Mittelwert</option>
        <option value="median">Median</option>
      </select>
    </label>

    <label>
      Sortierung:
      <select id="sortSel">
        <option value="asc">aufsteigend</option>
        <option value="desc">absteigend</option>
      </select>
    </label>
  </div>

  <div id="plot"></div>

  <script>
    async function main() {
      const raw = await fetch("./summary.json").then(r => r.json());

      const statSel = document.getElementById("statSel");
      const sortSel = document.getElementById("sortSel");

      function draw() {
        let data = [...raw];
        const stat = statSel.value;
        const desc = sortSel.value === "desc";

        data.sort((a, b) => desc ? b[stat] - a[stat] : a[stat] - b[stat]);

        const x = data.map(d => d.combo_str);
        const y = data.map(d => d[stat]);

        const errPlus = data.map(d => stat === "mean" ? d.upr_ci - d.mean : 0);
        const errMinus = data.map(d => stat === "mean" ? d.mean - d.lwr_ci : 0);

        const topTrace = {
          x,
          y,
          mode: "markers",
          type: "scatter",
          marker: { size: 10, color: "#1f77b4" },
          error_y: stat === "mean" ? {
            type: "data",
            symmetric: false,
            array: errPlus,
            arrayminus: errMinus,
            visible: true
          } : undefined,
          customdata: data.map(d => [d.N, d.mean, d.median]),
          hovertemplate:
            "<b>%{x}</b><br>" +
            "N: %{customdata[0]}<br>" +
            "Mittelwert: %{customdata[1]:.3f}<br>" +
            "Median: %{customdata[2]:.3f}<extra></extra>",
          xaxis: "x",
          yaxis: "y"
        };

        const sets = ["Club", "Sport", "NW"];
        const yMap = { "Club": 3, "Sport": 2, "NW": 1 };

        const matrixTraces = [];

        sets.forEach(setName => {
          matrixTraces.push({
            x,
            y: data.map(d => yMap[setName]),
            mode: "markers",
            type: "scatter",
            marker: {
              size: 14,
              color: data.map(d => d[setName] === 1 ? "#111" : "#d9d9d9")
            },
            hovertemplate: setName + "<extra></extra>",
            xaxis: "x2",
            yaxis: "y2",
            showlegend: false
          });
        });

        const layout = {
          grid: { rows: 2, columns: 1, pattern: "independent", roworder: "top to bottom" },
          height: 780,
          margin: { l: 70, r: 20, t: 30, b: 120 },
          plot_bgcolor: "white",
          paper_bgcolor: "white",

          xaxis: {
            tickangle: 45,
            showgrid: FALSE = false
          },
          yaxis: {
            title: stat === "mean" ? "Mittelwert (95%-KI)" : "Median",
            zeroline: false
          },

          xaxis2: {
            tickangle: 45
          },
          yaxis2: {
            tickvals: [1, 2, 3],
            ticktext: ["NW", "Sport", "Club"],
            range: [0.5, 3.5],
            showgrid: false,
            zeroline: false
          }
        };

        Plotly.newPlot("plot", [topTrace, ...matrixTraces], layout, {responsive: true});
      }

      statSel.addEventListener("change", draw);
      sortSel.addEventListener("change", draw);

      draw();
    }

    main();
  </script>
</body>
</html>
