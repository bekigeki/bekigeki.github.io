<script type="module">
  const status = document.getElementById("status");
  const root = document.getElementById("upset-root");

  async function main() {
    try {
      status.textContent = "Lade UpSet.js-Modul ...";
      const mod = await import("https://cdn.jsdelivr.net/npm/@upsetjs/bundle/+esm");

      status.textContent = "Lade JSON-Daten ...";
      const response = await fetch("./elems.json");
      if (!response.ok) {
        throw new Error(`elems.json konnte nicht geladen werden (${response.status})`);
      }

      const elems = await response.json();

      if (!Array.isArray(elems)) {
        throw new Error("elems.json ist kein Array von Objekten");
      }
      if (elems.length === 0) {
        throw new Error("elems.json ist leer");
      }
      if (!("name" in elems[0]) || !("sets" in elems[0])) {
        throw new Error("elems.json braucht Objekte mit 'name' und 'sets'");
      }

      status.textContent = `Bereite ${elems.length} Elemente auf ...`;

      const { extractCombinations, render } = mod;
      const { sets, combinations } = extractCombinations(elems);

      let selection = null;

      function rerender(sel = null) {
        selection = sel;
        render(root, {
          sets,
          combinations,
          width: root.clientWidth,
          height: root.clientHeight,
          selection,
          onHover: (s) => rerender(s)
        });
      }

      rerender();
      window.addEventListener("resize", () => rerender(selection));

      status.textContent = `Geladen: ${elems.length} Elemente`;
    } catch (err) {
      console.error(err);
      status.textContent = "Fehler: " + err.message;
    }
  }

  main();
</script>
